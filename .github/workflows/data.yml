name: Data contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Validate canonical export
        run: python scripts/validate_canonical_export.py
      - name: Check canonical names
        run: python scripts/backfill_canonical_names.py --dry-run
      - name: Canonical export tests
        run: pytest tests/test_canonical_export.py
